<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#6d28d9">
<title>魂师对决 · 5 以内加减法</title>
<style>
  :root{
    --bg:#f5f3ff;--card:#fff;--ink:#1e293b;--ink2:#64748b;--ink3:#94a3b8;
    --violet:#7c3aed;--violet-d:#5b21b6;--violet-l:#ede9fe;
    --gold:#f59e0b;--gold-l:#fef3c7;
    --grass:#10b981;--grass-l:#d1fae5;--coral:#ef4444;--coral-l:#fee2e2;
    --line:#e6e1f7;--r:22px;--sh:0 3px 14px rgba(90,60,160,.12);
    --dark:#1e1b4b;--dark2:#312e81;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    font-size:17px;padding:0 16px 26px;-webkit-font-smoothing:antialiased;
    min-height:100vh;display:flex;flex-direction:column;
  }
  .wrap{max-width:560px;margin:0 auto;width:100%;flex:1;display:flex;flex-direction:column}
  .hide{display:none !important}
  header{
    background:linear-gradient(135deg,#8b5cf6,#6d28d9 55%,#4c1d95);color:#fff;
    margin:0 -16px 16px;padding:20px 20px 18px;border-radius:0 0 26px 26px;
    box-shadow:0 6px 22px rgba(109,40,217,.32);position:relative;overflow:hidden;
  }
  header::after{                       /* 魂环光晕装饰（纯 CSS 自绘，非任何官方形象） */
    content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;
    border-radius:50%;border:2px solid rgba(255,255,255,.18);
    box-shadow:0 0 0 12px rgba(255,255,255,.06),0 0 0 26px rgba(255,255,255,.04);
  }
  .hd{display:flex;align-items:center;gap:10px;position:relative;z-index:1}
  header h1{margin:0;font-size:21px;flex:1;letter-spacing:.5px}
  .partner-chip{
    display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.22);
    border:1px solid rgba(255,255,255,.42);padding:4px 11px;border-radius:13px;font-size:14px;
  }
  .bar{height:9px;background:rgba(255,255,255,.28);border-radius:6px;margin-top:13px;overflow:hidden;position:relative;z-index:1}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,#fbbf24,#fff);border-radius:6px;width:0;transition:width .35s}
  .meta{display:flex;justify-content:space-between;font-size:13.5px;margin-top:7px;opacity:.95;position:relative;z-index:1}

  .stage{flex:1;display:flex;flex-direction:column;justify-content:center}

  /* ---------------- 选搭档 ---------------- */
  .pick{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:20px 16px 18px}
  .pick h2{margin:0 0 4px;font-size:19px;text-align:center}
  .pick p.hint{margin:0 0 16px;text-align:center;color:var(--ink2);font-size:15px}
  .roster{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  @media (max-width:400px){.roster{grid-template-columns:repeat(3,1fr)}}
  .rc{
    border:2px solid var(--line);border-radius:16px;background:#fff;padding:9px 4px 8px;
    text-align:center;cursor:pointer;transition:.15s;min-height:96px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    font-family:inherit;color:inherit;
  }
  .rc:active{transform:scale(.95)}
  .rc.on{border-color:var(--violet);background:var(--violet-l);box-shadow:0 4px 14px rgba(124,58,237,.24)}
  .rc .av{font-size:27px;line-height:1;display:flex;align-items:center;justify-content:center}
  .rc .av .rc-img{width:36px;height:36px;border-radius:50%;object-fit:cover;display:block}
  .rc .nm{font-size:14.5px;font-weight:800}
  .rc .wu{font-size:11.5px;color:var(--ink3)}

  /* ---------------- 对局 ---------------- */
  .foe{
    background:linear-gradient(135deg,var(--dark),var(--dark2));color:#fff;
    border-radius:var(--r);padding:14px 16px;margin-bottom:14px;
    display:flex;align-items:center;gap:14px;position:relative;overflow:hidden;
    box-shadow:0 6px 20px rgba(30,27,75,.28);
  }
  .foe::before{                        /* 脚下魂环光晕 */
    content:"";position:absolute;left:50%;bottom:-46px;transform:translateX(-50%);
    width:190px;height:80px;border-radius:50%;
    background:radial-gradient(ellipse at center,rgba(251,191,36,.45),transparent 70%);
    opacity:0;transition:opacity .3s;
  }
  .foe.cast::before{opacity:1}
  .foe .portrait{width:76px;height:76px;flex:0 0 76px;position:relative;z-index:1}
  .foe .portrait svg{width:100%;height:100%;display:block;transition:.25s}
  /* 放了肖像就用肖像（portraits/<角色名>.jpg|png|webp），没放自动回落到自绘 SVG */
  .foe .portrait .pf-img{
    width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;
    border:2px solid rgba(251,191,36,.5);box-shadow:0 0 10px rgba(251,191,36,.28);transition:.25s;
  }
  .foe.cast .portrait .pf-img{border-color:#fbbf24;box-shadow:0 0 22px rgba(251,191,36,.85)}
  .foe.cast .portrait svg{filter:drop-shadow(0 0 6px rgba(251,191,36,.9))}
  .foe .fi{flex:1;min-width:0;position:relative;z-index:1}
  .foe .fname{font-size:18px;font-weight:800;display:flex;align-items:center;gap:8px}
  .foe .fname .wu{
    font-size:12px;font-weight:600;color:var(--gold);
    border:1px solid rgba(251,191,36,.5);border-radius:9px;padding:1px 7px;
  }
  .foe .say{font-size:15px;margin-top:6px;color:#ddd6fe;min-height:22px;line-height:1.5}
  .foe.cast .portrait{animation:cast .5s ease}
  @keyframes cast{0%{transform:scale(1)}45%{transform:scale(1.16)}100%{transform:scale(1)}}

  .qbox{
    background:var(--card);border-radius:var(--r);box-shadow:var(--sh);
    padding:22px 18px 16px;text-align:center;margin-bottom:12px;
  }
  .q{font-size:48px;font-weight:800;letter-spacing:2px;font-variant-numeric:tabular-nums;margin:2px 0 14px}
  .qbox.no .q{color:var(--coral);animation:shake .32s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

  /* 魂环槽：答对逐个点亮 */
  .rings{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
  .ring{
    width:19px;height:19px;border-radius:50%;border:2.5px solid var(--line);
    background:#fafaff;transition:.28s;
  }
  .ring.on{border-color:var(--r-c,#f59e0b);box-shadow:0 0 10px var(--r-c,#f59e0b);background:var(--r-c,#f59e0b)}
  .ring.cur{border-color:var(--violet);animation:pulse 1.1s infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.22)}}

  .opts{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
  .opt{
    height:64px;border-radius:18px;border:2.5px solid var(--line);background:#fff;color:var(--ink);
    font-size:28px;font-weight:800;font-family:inherit;cursor:pointer;
    box-shadow:0 3px 10px rgba(90,60,160,.1);transition:.12s;
  }
  .opt:active{transform:scale(.95);background:var(--violet-l);border-color:var(--violet)}
  .opt.ok{background:var(--grass);border-color:var(--grass);color:#fff}
  .opt.no{background:var(--coral);border-color:var(--coral);color:#fff}
  .opt:disabled{opacity:.55}

  .combo{
    margin-top:12px;text-align:center;font-size:19px;font-weight:800;color:var(--violet);
    min-height:26px;opacity:0;transition:opacity .22s;
  }
  .combo.on{opacity:1;animation:pop .5s}
  @keyframes pop{0%{transform:scale(.5);opacity:0}60%{transform:scale(1.14)}100%{transform:scale(1);opacity:1}}

  .saytip{margin-top:10px;font-size:15px;color:var(--ink2);text-align:center;min-height:20px}

  /* ---------------- 结果 ---------------- */
  .end{display:none;background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:26px 20px;text-align:center;margin:auto 0}
  .end .medal{width:132px;height:132px;margin:0 auto 6px}
  .end h2{margin:6px 0 2px;font-size:23px}
  .end .rank{font-size:17px;font-weight:800;color:var(--violet-d);margin:2px 0 8px}
  .end .stars{font-size:34px;letter-spacing:3px;margin:4px 0 10px}
  .end .stars i{font-style:normal;opacity:.22}
  .end .stars i.on{opacity:1}
  .end p.sum{color:var(--ink2);margin:0 0 16px;font-size:16px}
  .wrongs{text-align:left;background:#fffdf7;border:1px solid var(--line);border-radius:14px;padding:12px 15px;margin:0 0 16px;font-size:15px;color:var(--ink2);line-height:1.9}
  .wrongs b{color:var(--coral)}
  .btn{
    min-height:52px;padding:13px 26px;border-radius:16px;border:0;cursor:pointer;
    font-size:17px;font-weight:800;font-family:inherit;margin:0 6px 10px;
    background:linear-gradient(135deg,#8b5cf6,#6d28d9);color:#fff;box-shadow:0 6px 18px rgba(109,40,217,.32);
  }
  .btn.ghost{background:#fff;color:var(--violet-d);box-shadow:0 3px 10px rgba(90,60,160,.16)}
  .btn:disabled{opacity:.42;box-shadow:none}
  .credit{margin-top:14px;font-size:12px;color:var(--ink3);line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="hd">
      <h1>⚔️ 魂师对决</h1>
      <span class="partner-chip hide" id="partnerChip">🤝 <b id="partnerName">—</b></span>
    </div>
    <div class="bar"><i id="bar"></i></div>
    <div class="meta">
      <span>第 <b id="idx">1</b> / 10 题</span>
      <span>魂环 <b id="ringCnt">0</b> / 10</span>
    </div>
  </header>

  <div class="stage">
    <!-- ============ 选搭档 ============ -->
    <div class="pick" id="pickView">
      <h2>选一位魂师当搭档</h2>
      <p class="hint">他会陪你练完这一轮 5 以内加减法</p>
      <div class="roster" id="roster"></div>
      <div style="text-align:center;margin-top:18px">
        <button class="btn" id="startBtn" disabled>开始对决</button>
      </div>
      <div class="credit">
        角色与图形均为本项目自创（自绘抽象符号），与任何第三方作品无关。
      </div>
    </div>

    <!-- ============ 对局 ============ -->
    <div id="playView" style="display:none">
      <div class="foe" id="foeBox">
        <div class="portrait" id="portrait"></div>
        <div class="fi">
          <div class="fname"><span id="foeName">墨白</span><span class="wu" id="foeWu">碧丝草</span></div>
          <div class="say" id="say">准备好了吗？</div>
        </div>
      </div>
      <div class="qbox" id="qbox">
        <div class="q" id="qText">3 + 2 = ?</div>
        <div class="rings" id="rings"></div>
      </div>
      <div class="opts" id="opts"></div>
      <div class="combo" id="combo"></div>
      <div class="saytip" id="sayTip"></div>
    </div>

    <!-- ============ 结果 ============ -->
    <div class="end" id="endView">
      <div class="medal" id="medal"></div>
      <h2 id="endTitle">对决结束</h2>
      <div class="rank" id="endRank"></div>
      <div class="stars" id="endStars"></div>
      <p class="sum" id="endSum"></p>
      <div class="wrongs" id="wrongList" style="display:none"></div>
      <button class="btn" id="againBtn">再来一轮</button>
      <button class="btn ghost" onclick="XYB.exit()">🏠 返回学习台</button>
      <div class="credit">
        角色与图形均为本项目自创（自绘抽象符号），与任何第三方作品无关。
      </div>
    </div>
  </div>
</div>

<script src="../../assets/xyb-sdk.js" data-module-id="math-wuhun-5"></script>
<script>
/* ==========================================================================
   魂师对决 · 5 以内加减法
   --------------------------------------------------------------------------
   · 7 位魂师轮流出场出题，答对点亮一枚魂环，连对 3 题触发"武魂觉醒"
   · 一轮 10 题，结束按表现评定魂环年份（十年/百年/千年/万年/十万年）
   · 答题与完成度通过 XYB.answer / progress / finish 上报；
     答错的题带题干 → 自动进工作台错题本
   · 刻意**不写 data-back**：一轮结束要停在结果页让孩子看评定，
     若带 data-back，XYB.finish() 会在 1.2 秒后自动跳回工作台
   ========================================================================== */

/* ---------------- 魂师（名称为文字引用；图形全部自绘抽象符号） ---------------- */
var ROLES = [
  { name:'墨白',   wu:'碧丝草',     emoji:'🍃', color:'#60a5fa', dark:'#1d4ed8',
    ok:['碧丝缠绕，控住了！','灵草一牵，稳稳的。','算得准，才控得住。'],
    no:['别急，稳住心神再算一次。','让草丝把数缠住，再数一遍。'] },
  { name:'灵鹊',   wu:'柔云兔',     emoji:'🐰', color:'#f9a8d4', dark:'#db2777',
    ok:['柔云身法，轻松拿下～','看我的！','这一下稳稳的～'],
    no:['哎呀，差一点点，再来嘛～','没关系，我们一起数。'] },
  { name:'雷铮',   wu:'雪虎',       emoji:'🐯', color:'#fcd34d', dark:'#b45309',
    ok:['雪虎硬冲，正面拿下！','够快，够准！'],
    no:['稳住，别慌，重新算。','深呼吸，再来一次。'] },
  { name:'汤圆',   wu:'恢复香肠',   emoji:'🌭', color:'#fdba74', dark:'#c2410c',
    ok:['补给到位，魂力回来了！','喏，恢复香肠给你！'],
    no:['补给没跟上，先歇一下～','再来一根，慢慢算。'] },
  { name:'炎烈',   wu:'火凤',       emoji:'🔥', color:'#fca5a5', dark:'#b91c1c',
    ok:['火凤展翅，燃起来了！','这题我给你烧穿！'],
    no:['火候差一点，再来。','别急，小心烧到自己。'] },
  { name:'锦书',   wu:'琉璃塔',     emoji:'🗼', color:'#c4b5fd', dark:'#6d28d9',
    ok:['琉璃塔开，给你增幅！','状态拉满，继续！'],
    no:['增幅还不够，我们再来一次。','我帮你稳住魂力。'] },
  { name:'夜影',   wu:'幽影猫',     emoji:'🐱', color:'#cbd5e1', dark:'#334155',
    ok:['幽影猫，速度快吧？','悄无声息，答完。'],
    no:['慢了半拍，下次更快。','再来，我看你行。'] }
];

/* ---------------- 魂环年份 ---------------- */
var RANKS = [
  { min:10, name:'十万年魂环', color:'#dc2626', edge:'#fbbf24', tip:'传说中的十万年魂环，全对！' },
  { min:8,  name:'万年魂环',   color:'#111827', edge:'#fbbf24', tip:'万年魂环到手，非常稳！' },
  { min:6,  name:'千年魂环',   color:'#8b5cf6', edge:'#c4b5fd', tip:'千年魂环，继续加油！' },
  { min:4,  name:'百年魂环',   color:'#f59e0b', edge:'#fcd34d', tip:'百年魂环，再练一轮会更好。' },
  { min:0,  name:'十年魂环',   color:'#94a3b8', edge:'#cbd5e1', tip:'第一枚魂环，慢慢来。' }
];

/* 连对达到这个数 → 武魂觉醒 */
var COMBO_AT = 3;
var TOTAL = 10;

var qs = [], cur = 0, right = 0, combo = 0, maxCombo = 0, wrongs = [], locked = false;
var partner = null, picked = -1, t0 = 0;

function $(id) { return document.getElementById(id); }
function rnd(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }

/* ---------------- 出题：答案必定落在 0~5 ---------------- */
function makeQ() {
  if (Math.random() < 0.55) {                 /* 加法：和 ≤ 5 */
    var a = rnd(0, 5), b = rnd(0, 5);
    while (a + b > 5 || a + b === 0) { a = rnd(0, 5); b = rnd(0, 5); }
    return { t: a + ' + ' + b + ' = ?', v: a + b, tag: '5以内加法' };
  }
  var x = rnd(1, 5), y = rnd(0, x);           /* 减法：被减数 ≤ 5，结果 ≥ 0 */
  if (x - y === 0 && Math.random() < 0.7) y = rnd(0, x - 1);   /* 少出一点"得 0" */
  return { t: x + ' - ' + y + ' = ?', v: x - y, tag: '5以内减法' };
}

function buildQs() {
  qs = [];
  var seen = {}, guard = 0;
  while (qs.length < TOTAL && guard++ < 900) {
    var q = makeQ();
    if (seen[q.t]) continue;
    seen[q.t] = 1;
    qs.push(q);
  }
  while (qs.length < TOTAL) qs.push(makeQ());   /* 保底 */
}

/* ---------------- 自绘抽象立绘（圆头 + 肩形 + 武魂符号；不复制任何官方形象） ---------------- */
function portraitSvg(role, lit) {
  var glow = lit
    ? '<ellipse cx="40" cy="70" rx="30" ry="8" fill="none" stroke="#fbbf24" stroke-width="2.5" opacity=".95"/>' +
      '<ellipse cx="40" cy="70" rx="23" ry="6" fill="none" stroke="#fbbf24" stroke-width="2" opacity=".7"/>'
    : '<ellipse cx="40" cy="70" rx="27" ry="7" fill="none" stroke="#fbbf24" stroke-width="1.6" opacity=".28"/>';
  return '<svg viewBox="0 0 80 80" aria-hidden="true">' + glow +
    '<path d="M14 70 Q40 44 66 70 Z" fill="' + role.dark + '" opacity=".92"/>' +
    '<circle cx="40" cy="36" r="17" fill="' + role.color + '"/>' +
    '<circle cx="40" cy="36" r="17" fill="none" stroke="' + role.dark + '" stroke-width="2" opacity=".45"/>' +
    '<text x="40" y="42" text-anchor="middle" font-size="16">' + role.emoji + '</text>' +
    '</svg>';
}

/* ---------------- 肖像：优先用 portraits/ 里的图，没有就回落到自绘 SVG ----------------
   纯静态页面**列不了目录**，所以按扩展名依次试探，第一个成功的用上；
   结果缓存起来，同一个角色只探一次。
   先画自绘立绘、图片加载成功后再替换 —— 任何时刻都有东西显示，不会留白。 */
var PF_EXT = ['jpg', 'png', 'webp', 'jpeg'];
var pfCache = {};                       /* 角色名 → 可用路径（null 表示没放图） */

function findPortrait(name, cb) {
  var c = pfCache[name];
  if (c !== undefined) { cb(c); return; }
  var i = 0;
  (function probe() {
    if (i >= PF_EXT.length) { pfCache[name] = null; cb(null); return; }
    var url = 'portraits/' + encodeURIComponent(name) + '.' + PF_EXT[i++];
    var im = new Image();
    im.onload = function () { pfCache[name] = url; cb(url); };
    im.onerror = probe;
    im.src = url;
  })();
}

/* 对局页的大立绘 */
function applyPortrait(el, role) {
  if (!el) return;
  el.innerHTML = portraitSvg(role);     /* 先占位 */
  findPortrait(role.name, function (url) {
    if (url) el.innerHTML = '<img class="pf-img" alt="" src="' + url + '">';
  });
}

/* 结果页的"魂环"图形 */
function medalSvg(rank) {
  var rings = '';
  for (var i = 0; i < 3; i++) {
    rings += '<ellipse cx="66" cy="' + (96 - i * 7) + '" rx="' + (40 - i * 6) + '" ry="' + (12 - i * 2) +
      '" fill="none" stroke="' + rank.color + '" stroke-width="4" opacity="' + (1 - i * 0.22) + '"/>';
  }
  return '<svg viewBox="0 0 132 132" aria-hidden="true">' +
    '<circle cx="66" cy="66" r="62" fill="none" stroke="' + rank.edge + '" stroke-width="3" opacity=".55"/>' +
    rings +
    '<circle cx="66" cy="46" r="22" fill="' + rank.color + '" opacity=".92"/>' +
    '<text x="66" y="54" text-anchor="middle" font-size="22">🏅</text>' +
    '</svg>';
}

/* ---------------- 选搭档 ---------------- */
$('roster').innerHTML = ROLES.map(function (r, i) {
  return '<button class="rc" data-i="' + i + '">' +
    '<span class="av">' + r.emoji + '</span>' +
    '<span class="nm">' + r.name + '</span>' +
    '<span class="wu">' + r.wu + '</span></button>';
}).join('');

/* 选搭档页的头像：放了肖像就换成肖像，没放保持 emoji */
Array.prototype.forEach.call(document.querySelectorAll('.rc'), function (btn, i) {
  findPortrait(ROLES[i].name, function (url) {
    if (!url) return;
    var av = btn.querySelector('.av');
    if (av) av.innerHTML = '<img class="rc-img" alt="" src="' + url + '">';
  });
});

$('roster').addEventListener('click', function (e) {
  var b = e.target.closest ? e.target.closest('.rc') : null;
  if (!b) return;
  picked = Number(b.getAttribute('data-i'));
  Array.prototype.forEach.call(document.querySelectorAll('.rc'), function (el) {
    el.classList.toggle('on', Number(el.getAttribute('data-i')) === picked);
  });
  $('startBtn').disabled = false;
});

$('startBtn').addEventListener('click', function () {
  if (picked < 0) return;
  partner = ROLES[picked];
  $('partnerName').textContent = partner.name;
  $('partnerChip').classList.remove('hide');
  $('pickView').style.display = 'none';
  $('playView').style.display = 'block';
  start();
});

/* ---------------- 出题 / 答题 ---------------- */
$('opts').innerHTML = [0, 1, 2, 3, 4, 5].map(function (n) {
  return '<button class="opt" data-v="' + n + '">' + n + '</button>';
}).join('');

function roleFor(i) {
  /* 出题者从搭档的"下一位"开始轮，保证每题换人 */
  var base = picked >= 0 ? picked : 0;
  return ROLES[(base + i + 1) % ROLES.length];
}

function ringColor() {
  return right >= 10 ? '#dc2626' : right >= 8 ? '#111827' : right >= 6 ? '#8b5cf6'
    : right >= 4 ? '#f59e0b' : '#c4b5fd';
}

function paintRings() {
  var box = $('rings');
  if (box.children.length !== TOTAL) {
    box.innerHTML = new Array(TOTAL + 1).join('<span class="ring"></span>');
  }
  var color = ringColor();
  Array.prototype.forEach.call(box.children, function (el, i) {
    var on = i < right;
    el.className = 'ring' + (on ? ' on' : '') + (!on && i === right ? ' cur' : '');
    el.style.setProperty('--r-c', color);
  });
  $('ringCnt').textContent = right;
}

function renderQ() {
  var q = qs[cur], role = roleFor(cur);
  $('foeName').textContent = role.name;
  $('foeWu').textContent = role.wu;
  applyPortrait($('portrait'), role);
  $('foeBox').classList.remove('cast');
  $('say').textContent = cur === 0
    ? '第一题交给我，' + partner.name + '在旁边看着呢。'
    : '第 ' + (cur + 1) + ' 题，看我的。';
  $('qText').textContent = q.t;
  $('qbox').classList.remove('no');
  $('idx').textContent = cur + 1;
  $('bar').style.width = (cur / TOTAL * 100) + '%';
  $('combo').classList.remove('on');
  $('combo').textContent = '';
  $('sayTip').textContent = '';
  Array.prototype.forEach.call($('opts').children, function (b) {
    b.classList.remove('ok', 'no');
    b.disabled = false;
  });
  locked = false;
  paintRings();
}

function sayLine(text) {
  $('say').textContent = text;
  try {
    if (window.XYB && XYB.speak) XYB.speak(text, { rate: 0.95 });
  } catch (e) { /* 朗读失败不影响答题 */ }
}

$('opts').addEventListener('click', function (e) {
  var b = e.target.closest ? e.target.closest('.opt') : null;
  if (!b || locked) return;
  var q = qs[cur], my = Number(b.getAttribute('data-v')), ok = my === q.v;
  locked = true;
  Array.prototype.forEach.call($('opts').children, function (el) { el.disabled = true; });

  /* ★ 上报答题（带题干 → 答错的自动进错题本） */
  XYB.answer(ok, { tag: q.tag, q: q.t, answer: q.v, my: my });

  var role = roleFor(cur);
  if (ok) {
    right++; combo++;
    if (combo > maxCombo) maxCombo = combo;
    b.classList.add('ok');
    /* 发光交给 CSS（.foe.cast）—— 这里**不重绘立绘**，
       否则会把已经加载好的肖像图片盖回 SVG */
    $('foeBox').classList.add('cast');
    sayLine(role.ok[rnd(0, role.ok.length - 1)]);
    XYB.progress(cur + 1, TOTAL);
    paintRings();
    if (combo >= COMBO_AT) {
      $('combo').textContent = '✨ 武魂觉醒 · 连对 ' + combo + ' 题！';
      $('combo').classList.add('on');
    }
  } else {
    combo = 0;
    wrongs.push(q.t.replace('?', q.v));
    b.classList.add('no');
    Array.prototype.forEach.call($('opts').children, function (el) {
      if (Number(el.getAttribute('data-v')) === q.v) el.classList.add('ok');
    });
    $('qbox').classList.add('no');
    $('say').textContent = role.no[rnd(0, role.no.length - 1)] + '（正确答案是 ' + q.v + '）';
    $('sayTip').textContent = '正确答案是 ' + q.v + '　·　一起再看一遍：' + q.t.replace('?', q.v);
  }

  setTimeout(function () {
    cur++;
    if (cur < TOTAL) renderQ();
    else finish();
  }, ok ? 700 : 1900);
});

/* ---------------- 结果 ---------------- */
function rankOf(n) {
  for (var i = 0; i < RANKS.length; i++) if (n >= RANKS[i].min) return RANKS[i];
  return RANKS[RANKS.length - 1];
}

function finish() {
  $('bar').style.width = '100%';
  $('playView').style.display = 'none';
  $('endView').style.display = 'block';

  var rank = rankOf(right);
  var stars = right >= 8 ? 3 : right >= 6 ? 2 : 1;
  $('medal').innerHTML = medalSvg(rank);
  $('endRank').textContent = '获得：' + rank.name;
  $('endRank').style.color = rank.color;
  $('endStars').innerHTML = [1, 2, 3].map(function (n) {
    return '<i class="' + (stars >= n ? 'on' : '') + '">⭐</i>';
  }).join('');
  $('endTitle').textContent = right >= 10 ? '全对！魂环融合成功'
    : right >= 8 ? '很强，稳稳的' : right >= 6 ? '完成啦，表现不错' : '完成啦，多练几轮会更棒';

  var sec = Math.round((Date.now() - t0) / 1000);
  $('endSum').textContent = '答对 ' + right + ' / ' + TOTAL + ' 题 · 用时 ' + fmtTime(sec) +
    ' · 最高连对 ' + maxCombo + ' 题';

  if (wrongs.length) {
    var w = $('wrongList');
    w.style.display = 'block';
    w.innerHTML = '<b>这几题再数一数：</b><br>' + wrongs.join('　·　');
  } else {
    $('wrongList').style.display = 'none';
  }
  $('say').textContent = rank.tip;

  /* ★ 上报完成（工作台加星 + 家长端记完成） */
  XYB.finish({ stars: stars, score: right, title: '魂师对决 · 5 以内加减法' });
}

function fmtTime(s) {
  var m = Math.floor(s / 60);
  return (m < 10 ? '0' + m : m) + ':' + ((s % 60) < 10 ? '0' : '') + (s % 60);
}

function start() {
  cur = 0; right = 0; combo = 0; maxCombo = 0; wrongs = []; locked = false;
  buildQs();
  renderQ();
  t0 = Date.now();
  XYB.progress(0, TOTAL);
}

$('againBtn').addEventListener('click', function () {
  $('wrongList').style.display = 'none';
  $('endView').style.display = 'none';
  $('playView').style.display = 'block';
  start();
});
</script>
</body>
</html>
