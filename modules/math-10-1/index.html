<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0d9488">
<title>🧮 10以内加减法</title>
<!--
  ==========================================================================
  10以内加减法 · 三关递进练习（math-10-1）
  - 加法关（和≤10）→ 减法关（被减数≤10）→ 混合关，每关 10 题一轮
  - 十格阵点子图：加法两种颜色分开摆；减法先把要减掉的圈出来，交卷后划掉
  - 每题经 XYB.answer() 上报（带题干，答错自动进工作台错题本）；
    一轮完经 XYB.finish() 上报，工作台加星星
  - 最好成绩存 localStorage 'xyb.v1.math10'（纯本地偏好，不进同步）
  接入规范见 docs/模块接入规范.md
  ==========================================================================
-->
<style>
  :root{
    --bg:#f0fdfa;--card:#fff;--ink:#1e293b;--ink2:#5c6e85;--ink3:#8fa0b6;
    --teal:#0d9488;--teal-d:#0f766e;--teal-l:#ccfbf1;--teal-xl:#f0fdfa;
    --amber:#f59e0b;--grass:#10b981;--grass-l:#d1fae5;--coral:#ef4444;--coral-l:#fee2e2;
    --line:#d7e8e3;--r:20px;--sh:0 3px 14px rgba(13,148,136,.12);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    font-size:17px;padding:0 16px 24px;-webkit-font-smoothing:antialiased;
    min-height:100vh;display:flex;flex-direction:column;
  }
  .wrap{max-width:560px;margin:0 auto;width:100%;flex:1;display:flex;flex-direction:column}
  header{
    background:linear-gradient(135deg,#2dd4bf,#0d9488);color:#fff;
    margin:0 -16px 18px;padding:20px 20px 18px;border-radius:0 0 26px 26px;
    box-shadow:0 6px 22px rgba(13,148,136,.3);
  }
  .hd{display:flex;align-items:center;gap:12px}
  header h1{margin:0;font-size:21px;flex:1}
  header .timer{
    background:rgba(255,255,255,.24);border:1px solid rgba(255,255,255,.45);
    padding:5px 13px;border-radius:12px;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;
  }
  .levels{display:flex;gap:8px;margin-top:14px}
  .lvl{
    flex:1;min-height:48px;border-radius:14px;border:1.5px solid rgba(255,255,255,.5);
    background:rgba(255,255,255,.14);color:#fff;font-size:15px;font-weight:800;font-family:inherit;
    cursor:pointer;transition:.15s;padding:5px 2px;line-height:1.25;
  }
  .lvl small{display:block;font-size:11px;font-weight:700;opacity:.85;margin-top:1px}
  .lvl.on{background:#fff;color:var(--teal-d);border-color:#fff;box-shadow:0 3px 10px rgba(0,0,0,.14)}
  .lvl.on small{opacity:.7}
  .bar{height:10px;background:rgba(255,255,255,.3);border-radius:6px;margin-top:14px;overflow:hidden}
  .bar i{display:block;height:100%;background:#fff;border-radius:6px;width:0;transition:width .35s}
  .meta{display:flex;justify-content:space-between;font-size:13px;margin-top:7px;opacity:.95;gap:8px}
  .meta b{font-variant-numeric:tabular-nums}

  .stage{flex:1;display:flex;flex-direction:column;justify-content:center}
  .qbox{
    background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:24px 20px 22px;
    text-align:center;margin-bottom:16px;
  }
  .q{font-size:46px;font-weight:800;letter-spacing:2px;font-variant-numeric:tabular-nums;margin:2px 0 8px}
  .spk{
    border:1.5px solid var(--line);background:var(--teal-xl);color:var(--teal-d);
    border-radius:999px;padding:7px 16px;font-size:14px;font-weight:800;font-family:inherit;cursor:pointer;
  }
  .spk:active{transform:scale(.95)}
  .frame{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;max-width:290px;margin:16px auto 8px}
  .frame i{aspect-ratio:1;border-radius:50%;border:2px dashed var(--line);background:#f8fbf9;display:block}
  .frame i.a{background:var(--teal);border-color:var(--teal);animation:pop .3s}
  .frame i.b{background:var(--amber);border-color:var(--amber);animation:pop .3s}
  .frame i.togo{border:2px dashed var(--amber);background:#fff;animation:pop .3s}
  .frame i.x{background:#e2e8f0;border-color:#cbd5e1;position:relative;animation:pop .3s}
  .frame i.x::after{
    content:'✕';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:var(--coral);font-size:clamp(14px,4.5vw,20px);font-weight:800;
  }
  .frame i.w{background:var(--grass);border-color:var(--grass);animation:bounce .5s}
  @keyframes pop{from{transform:scale(.2);opacity:0}}
  @keyframes bounce{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
  .cap{font-size:13px;color:var(--ink3);margin:2px 0 14px;min-height:20px}
  .ansbox{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    min-width:170px;height:70px;border-radius:18px;background:var(--teal-xl);
    border:3px dashed #a7dcd2;font-size:38px;font-weight:800;color:var(--teal-d);
    font-variant-numeric:tabular-nums;padding:0 18px;transition:.15s;
  }
  .ansbox.empty{color:#b6d9d0}
  .ansbox.ok{border-style:solid;border-color:var(--grass);background:var(--grass-l);color:#047857}
  .ansbox.no{border-style:solid;border-color:var(--coral);background:var(--coral-l);color:#b91c1c}
  .tip{min-height:28px;font-size:17px;font-weight:700;margin-top:12px}
  .tip.ok{color:var(--grass)}.tip.no{color:var(--coral)}

  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
  .key{
    height:62px;border-radius:17px;border:0;background:#fff;color:var(--ink);
    font-size:26px;font-weight:800;font-family:inherit;cursor:pointer;
    box-shadow:0 3px 10px rgba(13,148,136,.14);transition:.12s;
  }
  .key:active{transform:scale(.94);background:var(--teal-l)}
  .key.fn{background:linear-gradient(135deg,#2dd4bf,#0d9488);color:#fff;font-size:21px}

  .end{display:none;text-align:center;background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:30px 22px;margin:auto 0}
  .end .big{font-size:62px;line-height:1.1}
  .end h2{margin:10px 0 4px;font-size:24px}
  .stars{font-size:38px;letter-spacing:2px;margin:8px 0}
  .stars i{font-style:normal;opacity:.25}
  .stars i.on{opacity:1}
  .end p{color:var(--ink2);margin:6px 0 20px}
  .btn{
    min-height:52px;padding:13px 26px;border-radius:16px;border:0;cursor:pointer;
    font-size:17px;font-weight:800;font-family:inherit;margin:0 6px 10px;
    background:linear-gradient(135deg,#2dd4bf,#0d9488);color:#fff;box-shadow:0 6px 18px rgba(13,148,136,.34);
  }
  .btn.ghost{background:#fff;color:var(--teal-d);box-shadow:0 3px 10px rgba(13,148,136,.16)}
  .wrongs{text-align:left;background:var(--teal-xl);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin:0 0 18px;font-size:15px;color:var(--ink2)}
  .wrongs b{color:var(--coral)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="hd">
      <h1>🧮 10以内加减法</h1>
      <span class="timer" id="timer">00:00</span>
    </div>
    <div class="levels" id="levels"></div>
    <div class="bar"><i id="bar"></i></div>
    <div class="meta">
      <span>第 <b id="idx">1</b> / 10 题</span>
      <span>答对 <b id="rightCnt">0</b> 题</span>
      <span>本关最好 <b id="bestCnt">☆</b></span>
    </div>
  </header>

  <div class="stage" id="stage">
    <div class="qbox">
      <div class="q" id="qText">3 + 2 = ?</div>
      <button class="spk" id="spkBtn">🔊 读一遍题</button>
      <div class="frame" id="frame"></div>
      <div class="cap" id="cap"></div>
      <div class="ansbox empty" id="ansBox">?</div>
      <div class="tip" id="tip"></div>
    </div>
    <div class="pad" id="pad"></div>
  </div>

  <div class="end" id="endView">
    <div class="big" id="endEmoji">🎉</div>
    <h2 id="endTitle">全部完成！</h2>
    <div class="stars" id="endStars"></div>
    <p id="endSum"></p>
    <div class="wrongs" id="wrongList" style="display:none"></div>
    <button class="btn" id="againBtn">再来一轮</button>
    <button class="btn ghost" onclick="XYB.exit()">返回学习台</button>
  </div>
</div>

<script src="../../assets/xyb-sdk.js" data-module-id="math-10-1" data-back="1"></script>
<script>
/* ==========================================================================
   10以内加减法 · 三关递进
   ========================================================================== */
var TOTAL = 10;
var CN = ['零','一','二','三','四','五','六','七','八','九','十'];
var PRAISE = ['答对啦 👍', '真棒 ✨', '算得又快又准 🎯', '就是这种感觉 💪'];
var LEVELS = {
  add: { name: '加法关', emoji: '🟢', tag: '10以内加法' },
  sub: { name: '减法关', emoji: '🔵', tag: '10以内减法' },
  mix: { name: '混合关', emoji: '🟣', tag: '10以内加减混合' }
};

/* ---------- 本地偏好：当前关卡 + 各关最好成绩（纯本地，不进同步） ---------- */
var LS_KEY = 'xyb.v1.math10';
function loadStore() {
  try { var d = JSON.parse(localStorage.getItem(LS_KEY)); return (d && typeof d === 'object') ? d : {}; }
  catch (e) { return {}; }
}
var store = loadStore();
if (!store.best) store.best = {};
function saveStore() { try { localStorage.setItem(LS_KEY, JSON.stringify(store)); } catch (e) {} }
var level = LEVELS[store.level] ? store.level : 'add';

var qs = [], cur = 0, input = '', right = 0, wrongs = [], locked = false;
var t0 = Date.now(), timerId = null;

function rnd(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }

/* 前 5 题放水（加法和≤6 / 减法被减数≤7），后 5 题到 10 —— 刚上手需要台阶 */
function makeQ(idx) {
  var easy = idx < 5;
  var sub = (level === 'sub') || (level === 'mix' && idx % 2 === 1);
  if (sub) {
    var a = rnd(easy ? 3 : 7, easy ? 7 : 10), b = rnd(1, a - 1);
    return { op: '-', a: a, b: b, v: a - b, t: a + ' - ' + b + ' = ?', tag: LEVELS.sub.tag };
  }
  var x, y;
  do { x = rnd(1, easy ? 5 : 9); y = rnd(1, easy ? 5 : 9); } while (x + y > (easy ? 6 : 10));
  return { op: '+', a: x, b: y, v: x + y, t: x + ' + ' + y + ' = ?', tag: LEVELS.add.tag };
}

function buildQs() {
  qs = []; cur = 0; right = 0; wrongs = []; input = ''; locked = false;
  var seen = {};
  while (qs.length < TOTAL) {
    var q = makeQ(qs.length);
    if (seen[q.t]) continue;
    seen[q.t] = 1;
    qs.push(q);
  }
}

/* ---------- 十格阵 ---------- */
/* mode: undefined=出题状态 | 'strike'=交卷后划掉要减的 | 'win'=答对的庆祝配色 */
function paintFrame(q, mode) {
  var html = '';
  for (var i = 0; i < 10; i++) {
    var cls = '';
    if (q.op === '+') {
      if (i < q.a + q.b) cls = mode === 'win' ? 'w' : (i < q.a ? 'a' : 'b');
    } else if (i < q.a - q.b) {
      cls = mode === 'win' ? 'w' : 'a';
    } else if (i < q.a) {
      cls = mode ? 'x' : 'togo';
    }
    html += '<i class="' + cls + '"></i>';
  }
  document.getElementById('frame').innerHTML = html;
  document.getElementById('cap').textContent = q.op === '+'
    ? '两种颜色分开摆，数一共摆了几个？'
    : '虚线的点子是要减掉的，交卷后划给你看';
}

/* ---------- 元素 ---------- */
var elQ = document.getElementById('qText'), elAns = document.getElementById('ansBox'),
    elTip = document.getElementById('tip'), elIdx = document.getElementById('idx'),
    elRight = document.getElementById('rightCnt'), elBar = document.getElementById('bar'),
    elBest = document.getElementById('bestCnt'), elLevels = document.getElementById('levels');

function updateBest() {
  var b = store.best[level] || 0;
  elBest.textContent = b ? '⭐'.repeat(b) : '☆';
}

function renderLevels() {
  elLevels.innerHTML = Object.keys(LEVELS).map(function (k) {
    var b = store.best[k] || 0;
    return '<button class="lvl' + (k === level ? ' on' : '') + '" data-lv="' + k + '">' +
      LEVELS[k].emoji + ' ' + LEVELS[k].name +
      '<small>最好 ' + (b ? '⭐'.repeat(b) : '—') + '</small></button>';
  }).join('');
}

elLevels.addEventListener('click', function (e) {
  var b = e.target.closest('.lvl');
  if (!b) return;
  var lv = b.getAttribute('data-lv');
  if (!LEVELS[lv] || lv === level) return;
  level = lv;
  store.level = lv;
  saveStore();
  renderLevels();
  restart();
});

/* ---------- 数字键盘 ---------- */
var pad = document.getElementById('pad');
pad.innerHTML = [1, 2, 3, 4, 5, 6, 7, 8, 9].map(function (n) {
  return '<button class="key" data-k="' + n + '">' + n + '</button>';
}).join('') +
  '<button class="key fn" data-k="0">0</button>' +
  '<button class="key fn" data-k="del">⌫</button>' +
  '<button class="key fn" data-k="ok">确定</button>';

pad.addEventListener('click', function (e) {
  var b = e.target.closest('.key');
  if (!b || locked) return;
  var k = b.getAttribute('data-k');
  if (k === 'del') { input = input.slice(0, -1); paintAns(); return; }
  if (k === 'ok') { submit(); return; }
  if (input.length >= 2) return;                 /* 答案最大两位（10） */
  input += k;
  paintAns();
});

function paintAns() {
  elAns.textContent = input === '' ? '?' : input;
  elAns.className = 'ansbox' + (input === '' ? ' empty' : '');
}

function renderQ() {
  var q = qs[cur];
  elQ.textContent = q.t;
  input = '';
  paintAns();
  elTip.textContent = '';
  elTip.className = 'tip';
  elIdx.textContent = cur + 1;
  elBar.style.width = (cur / TOTAL * 100) + '%';
  paintFrame(q);
  updateBest();
}

function submit() {
  if (input === '') { elTip.textContent = '先输入答案哦'; elTip.className = 'tip no'; return; }
  locked = true;
  var q = qs[cur], ok = Number(input) === q.v;

  /* ★ 上报答题结果：带上题面和正确答案，答错的题会自动进工作台错题本 */
  XYB.answer(ok, { tag: q.tag, q: q.t, answer: q.v, my: input });
  XYB.progress(cur + 1, TOTAL);

  if (ok) {
    right++;
    elAns.className = 'ansbox ok';
    elTip.textContent = PRAISE[right % PRAISE.length];
    elTip.className = 'tip ok';
    elRight.textContent = right;
    paintFrame(q, 'win');
  } else {
    wrongs.push(q.t.replace('?', q.v));
    elAns.className = 'ansbox no';
    elTip.textContent = '再想想～正确答案是 ' + q.v;
    elTip.className = 'tip no';
    paintFrame(q, 'strike');
  }

  setTimeout(function () {
    locked = false;
    cur++;
    if (cur < TOTAL) renderQ();
    else finish();
  }, ok ? 560 : 1500);
}

function finish() {
  clearInterval(timerId);
  elBar.style.width = '100%';
  document.getElementById('stage').style.display = 'none';
  var end = document.getElementById('endView');
  end.style.display = 'block';

  /* 正确率 ≥90% 三星，≥70% 两星，其余一星（接入规范的建议线） */
  var stars = right >= 9 ? 3 : right >= 7 ? 2 : 1;
  document.getElementById('endStars').innerHTML =
    [1, 2, 3].map(function (n) { return '<i class="' + (stars >= n ? 'on' : '') + '">⭐</i>'; }).join('');
  document.getElementById('endEmoji').textContent = right >= 9 ? '🏆' : right >= 7 ? '🎉' : '💪';
  document.getElementById('endTitle').textContent =
    right >= 9 ? '全对！太厉害了' : right >= 7 ? '完成啦，表现不错' : '完成啦，多练几轮会更棒';

  var sec = Math.round((Date.now() - t0) / 1000);
  document.getElementById('endSum').textContent =
    LEVELS[level].emoji + ' ' + LEVELS[level].name + ' · 答对 ' + right + ' / ' + TOTAL +
    ' 题 · 用时 ' + fmtTime(sec) + ' · 正确率 ' + Math.round(right / TOTAL * 100) + '%';

  if (wrongs.length) {
    var w = document.getElementById('wrongList');
    w.style.display = 'block';
    w.innerHTML = '<b>这些题再想想：</b><br>' + wrongs.join('　·　');
  }

  if (stars > (store.best[level] || 0)) { store.best[level] = stars; saveStore(); }
  updateBest();
  renderLevels();

  /* ★ 上报完成：工作台加星星 + 计入家长端 */
  XYB.finish({ stars: stars, score: right, title: '10以内加减法 · ' + LEVELS[level].name });
}

/* ---------- 朗读 ---------- */
document.getElementById('spkBtn').addEventListener('click', function () {
  var q = qs[cur];
  if (!q) return;
  if (typeof XYB.canSpeak === 'function' && !XYB.canSpeak()) {
    elTip.textContent = '这个设备不会朗读，咱们自己念题吧';
    elTip.className = 'tip no';
    return;
  }
  XYB.speak(CN[q.a] + (q.op === '+' ? ' 加 ' : ' 减 ') + CN[q.b] + ' 等于几');
});

/* ---------- 计时 ---------- */
function fmtTime(s) {
  var m = Math.floor(s / 60);
  return (m < 10 ? '0' + m : m) + ':' + ((s % 60) < 10 ? '0' : '') + (s % 60);
}
function startTimer() {
  clearInterval(timerId);
  t0 = Date.now();
  document.getElementById('timer').textContent = '00:00';
  timerId = setInterval(function () {
    document.getElementById('timer').textContent = fmtTime(Math.round((Date.now() - t0) / 1000));
  }, 500);
}

function restart() {
  clearInterval(timerId);
  buildQs();
  document.getElementById('endView').style.display = 'none';
  document.getElementById('stage').style.display = 'flex';
  document.getElementById('rightCnt').textContent = '0';
  document.getElementById('wrongList').style.display = 'none';
  renderQ();
  startTimer();
  XYB.progress(0, TOTAL);
}

document.getElementById('againBtn').addEventListener('click', restart);

/* 启动 */
renderLevels();
restart();
</script>
</body>
</html>
