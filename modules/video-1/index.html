<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e11d48">
<title>视频学堂</title>
<!--
  ==========================================================================
  视频学堂 —— 按学科分类的学习视频库（学科 → 系列 → 集）
  --------------------------------------------------------------------------
  ★ 清单不是写在这里的，而是由脚本生成：modules/video-1/videos.js
      加视频：python _build/add_video.py "文件" --subject 语文 --upload
              （或手动放 videos/<学科>/<系列>/NN-集.mp4 再跑 build_video_index.py）
  ★ 为什么清单要预生成：纯静态页面列不了目录 —— file:// 下没有目录 API，
      nginx 不开 autoindex 也拿不到文件列表。
  ★ 两级结构：一个学科下可能有很多"系列"（语文就有 9 个系列 108 集），
      平铺成一长条没法用，所以系列默认折叠，点开才展开该系列的集。
  ★ 刻意不加 data-back="1"：SDK 的 finish() 在带 back 标记时会在 1.2 秒后
      自动跳回工作台，而"看完第 1 个视频"不该把人弹走。返回入口本页自己做。
  ==========================================================================
-->
<style>
  :root{
    --bg:#fdf3f5;--card:#fff;--ink:#1e293b;--ink2:#5c6e85;--ink3:#8fa0b6;
    --brand:#e11d48;--brand-d:#9f1239;--brand-l:#ffe4e9;--brand-xl:#fff5f7;
    --grass:#10b981;--grass-l:#d1fae5;--amber:#f59e0b;--amber-l:#fef3c7;
    --coral:#ef4444;--line:#f0dde2;--r:20px;--sh:0 3px 14px rgba(120,35,60,.09);
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    font-size:17px;line-height:1.7;padding:0 16px 110px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:760px;margin:0 auto}
  header{
    background:linear-gradient(135deg,#e11d48,#a855f7);color:#fff;
    margin:0 -16px 20px;padding:26px 22px 22px;border-radius:0 0 26px 26px;
    box-shadow:0 6px 22px rgba(180,40,90,.24);
  }
  .hd{display:flex;align-items:center;justify-content:space-between;gap:12px}
  header h1{margin:0;font-size:24px}
  .score{font-size:14.5px;background:rgba(255,255,255,.22);padding:5px 12px;border-radius:999px;white-space:nowrap}
  .bar{height:9px;background:rgba(255,255,255,.28);border-radius:5px;margin-top:14px;overflow:hidden}
  .bar i{display:block;height:100%;background:#fff;border-radius:5px;width:0;transition:width .45s}
  .sub{margin:10px 0 0;font-size:14px;opacity:.93}

  /* ---------- 学科分类 ---------- */
  .tabs{display:flex;gap:9px;overflow-x:auto;padding:2px 0 14px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{
    flex:0 0 auto;min-height:46px;padding:0 18px;border-radius:999px;border:2px solid var(--line);
    background:#fff;color:var(--ink2);font-size:16px;font-weight:700;font-family:inherit;
    cursor:pointer;transition:.18s;display:flex;align-items:center;gap:7px;white-space:nowrap;
  }
  .tab .n{font-size:13px;opacity:.7;font-weight:600}
  .tab.on{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 5px 16px rgba(225,29,72,.3)}
  .tab.on .n{opacity:.85}

  /* ---------- 系列（可折叠） ---------- */
  .list{display:grid;gap:14px}
  .series{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
  .shead{
    display:flex;align-items:center;gap:10px;width:100%;min-height:62px;padding:12px 15px;
    border:0;background:transparent;font-family:inherit;color:inherit;cursor:pointer;text-align:left;
  }
  .shead .edge{width:6px;align-self:stretch;border-radius:4px;flex:0 0 6px}
  .shead .stx{flex:1;min-width:0}
  .shead .sname{display:block;font-size:16.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .shead .smeta{display:block;font-size:13px;color:var(--ink3);margin-top:2px}
  .shead .arw{font-size:14px;color:var(--ink3);flex:0 0 auto;transition:transform .18s}
  .series.open .shead .arw{transform:rotate(90deg)}
  .sbody{display:none;padding:0 12px 12px}
  .series.open .sbody{display:grid;gap:10px}

  /* ---------- 视频卡片 ---------- */
  .vcard{
    display:flex;align-items:stretch;background:#fff;border-radius:15px;
    border:1.5px solid var(--line);overflow:hidden;cursor:pointer;padding:0;
    text-align:left;font-family:inherit;color:inherit;transition:.15s;width:100%;
  }
  .vcard:active{transform:scale(.994)}
  .vcard .thumb{
    flex:0 0 96px;height:70px;background:linear-gradient(135deg,#ffe4e9,#f3e8ff);
    display:flex;align-items:center;justify-content:center;font-size:28px;position:relative;
  }
  .vcard .thumb .dur{
    position:absolute;right:4px;bottom:4px;background:rgba(0,0,0,.62);color:#fff;
    font-size:11.5px;padding:0 6px;border-radius:6px;font-weight:600;
  }
  .vcard .body{padding:9px 12px;flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
  .vcard .t{font-size:15.5px;font-weight:700;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .vcard .d{font-size:13px;color:var(--ink3);margin:2px 0 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .vcard .st{font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;white-space:nowrap;align-self:flex-start;margin-top:3px;display:inline-block}
  .st.done{background:var(--grass-l);color:#047857}
  .st.todo{background:var(--brand-l);color:var(--brand-d)}
  .st.bad{background:#fee2e2;color:#b91c1c}
  .vcard.watched .thumb::after{
    content:'✓';position:absolute;left:5px;top:4px;width:21px;height:21px;border-radius:50%;
    background:var(--grass);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;font-weight:800;
  }
  .resume{display:inline-block;font-size:11.5px;color:var(--brand-d);background:var(--brand-l);border-radius:6px;padding:0 6px;margin-top:3px;font-weight:600}

  .empty{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:30px 22px;text-align:center}
  .empty .big{font-size:46px;margin-bottom:8px}
  .empty h3{margin:0 0 8px;font-size:19px}
  .empty p{margin:0 0 8px;color:var(--ink2);font-size:15px}
  .empty code{background:#f1f5f9;padding:2px 7px;border-radius:6px;font-size:13.5px;color:#334155}
  .btn{
    min-height:50px;padding:12px 24px;border-radius:15px;border:0;cursor:pointer;
    font-size:17px;font-weight:700;font-family:inherit;background:var(--brand);color:#fff;
    box-shadow:0 6px 18px rgba(225,29,72,.3);margin:6px 5px 0;
  }
  .btn.ghost{background:#fff;color:var(--ink2);border:2px solid var(--line);box-shadow:none}

  /* ---------- 播放层 ---------- */
  .player{
    position:fixed;inset:0;background:#0b1020;z-index:60;display:flex;flex-direction:column;
    padding:calc(env(safe-area-inset-top,0px) + 10px) 12px calc(env(safe-area-inset-bottom,0px) + 14px);
  }
  .player.hide{display:none}
  .pbar{display:flex;align-items:center;gap:12px;margin-bottom:10px;color:#fff}
  .pbar button{
    background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:12px;
    min-height:42px;padding:0 15px;font-size:15.5px;font-weight:700;font-family:inherit;cursor:pointer;
  }
  .pbar .pt{font-size:15.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
  video{width:100%;max-height:64vh;background:#000;border-radius:14px;display:block}
  .pwrap{max-width:900px;margin:0 auto;width:100%}
  .pinfo{margin-top:12px;color:#cbd5e1;font-size:14.5px;line-height:1.9}
  .ptip{
    margin-top:12px;background:rgba(239,68,68,.16);border:1px solid rgba(239,68,68,.5);
    color:#fecaca;border-radius:12px;padding:12px 14px;font-size:14.5px;display:none;line-height:1.85;
  }
  .ptip.on{display:block}
  .ptip b{color:#fff}
  .ptip .acts{margin-top:9px}
  .ptip button{
    background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:10px;
    min-height:40px;padding:0 14px;font-size:14.5px;font-weight:700;font-family:inherit;cursor:pointer;margin-right:8px;
  }
  .pbuf{margin-top:10px;color:#94a3b8;font-size:14px;display:none}
  .pbuf.on{display:block}
  .pwrap .done-tag{
    display:none;margin-top:12px;background:rgba(16,185,129,.16);border:1px solid rgba(16,185,129,.5);
    color:#a7f3d0;border-radius:12px;padding:11px 14px;font-size:15px;font-weight:700;
  }
  .pwrap .done-tag.on{display:block}
  .hide{display:none !important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="hd">
      <h1>🎬 视频学堂</h1>
      <span class="score">已看 <b id="seenCnt">0</b>/<span id="allCnt">0</span></span>
    </div>
    <div class="bar"><i id="bar"></i></div>
    <p class="sub" id="subline">按学科挑一个，看完就自动算学会啦。</p>
  </header>

  <div class="tabs" id="tabs"></div>
  <div class="list" id="list"></div>

  <div class="empty hide" id="empty">
    <div class="big">🎬</div>
    <h3>这里还没有视频</h3>
    <p id="emptyMsg">请家长把视频放进 <code>videos/&lt;学科&gt;/</code>，然后重新生成清单并上传。</p>
    <button class="btn ghost" id="emptyBack">← 返回工作台</button>
  </div>

  <div class="list" style="margin-top:22px">
    <button class="btn ghost" id="backHome" style="width:100%">← 返回工作台</button>
  </div>
</div>

<!-- ------------------------------ 播放层 ------------------------------ -->
<div class="player hide" id="player">
  <div class="pwrap">
    <div class="pbar">
      <button id="pBack">← 返回列表</button>
      <span class="pt" id="pTitle"></span>
    </div>
    <video id="vid" controls playsinline preload="metadata" controlslist="nodownload"></video>
    <div class="pbuf" id="pbuf">正在加载视频…如果一直停在这里，多半是没连上家里的网，或者视频还没上传到服务器。</div>
    <div class="ptip" id="ptip"></div>
    <div class="done-tag" id="pdone">🎉 这个视频看完啦，已经记上了</div>
    <div class="pinfo" id="pinfo"></div>
  </div>
</div>

<!-- ★ 接入工作台：data-module-id 必须与 catalog.js 一致；刻意不写 data-back（见文件头） -->
<script src="../../assets/xyb-sdk.js" data-module-id="video-1"></script>
<!-- ★ 视频清单：由 _build/build_video_index.py 生成 -->
<script src="./videos.js"></script>
<script>
(function () {
  'use strict';

  var DATA = window.XYB_VIDEOS || { subjects: [], total: 0, totalSeconds: 0 };
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  };
  /* 看完多少算学会：90%（片尾字幕不算） */
  var DONE_RATIO = 0.9;
  /* 播放位置记忆的最短秒数：太短不值得记，下次还是从头看 */
  var RESUME_MIN = 15;

  /* ---------------- 本地记录（模块页自己用，跟着设备走） ---------------- */
  var K_DONE = 'xyb.video.done.v1';
  var K_POS = 'xyb.video.pos.v1';

  function readMap(k) {
    try { return JSON.parse(localStorage.getItem(k) || '{}') || {}; } catch (e) { return {}; }
  }
  function writeMap(k, m) {
    try { localStorage.setItem(k, JSON.stringify(m)); } catch (e) {}
  }
  var doneMap = readMap(K_DONE);
  var posMap = readMap(K_POS);

  /* 两级结构：学科 → 系列 → 集。这里先摊平，方便算总进度、按 id 反查 */
  var all = [];
  (DATA.subjects || []).forEach(function (g) {
    (g.series || []).forEach(function (s) {
      (s.items || []).forEach(function (it) {
        all.push({ g: g, s: s, it: it });
      });
    });
  });

  function fmtDur(sec) {
    sec = Math.max(0, Math.round(sec || 0));
    var m = Math.floor(sec / 60), s = sec % 60;
    return m + ':' + (s < 10 ? '0' : '') + s;
  }
  function doneCount() {
    var n = 0;
    all.forEach(function (x) { if (doneMap[x.it.id]) n++; });
    return n;
  }
  function seriesSeen(s) {
    return (s.items || []).filter(function (it) { return doneMap[it.id]; }).length;
  }

  /* ---------------- 上报：完成度进工作台，全部看完才算"学完" ---------------- */
  function reportProgress() {
    if (!window.XYB || !XYB.progress) return;
    XYB.progress(doneCount(), all.length);
  }
  function markDone(item) {
    if (!doneMap[item.id]) {
      doneMap[item.id] = Date.now();
      writeMap(K_DONE, doneMap);
      reportProgress();
      /* ★ 只有**全部**视频都看完，才算这个内容学完（加星、计入家长端） */
      if (all.length && doneCount() >= all.length && window.XYB && XYB.finish) {
        XYB.finish({ stars: 3, title: '视频学堂' });
      }
    }
    paintHeader();
  }

  /* ---------------- 顶部进度 ---------------- */
  function paintHeader() {
    var d = doneCount();
    $('seenCnt').textContent = d;
    $('allCnt').textContent = all.length;
    $('bar').style.width = (all.length ? (d / all.length * 100) : 0) + '%';
    if (all.length) {
      var left = all.length - d;
      $('subline').textContent = left > 0
        ? '还有 ' + left + ' 个没看，挑一个开始吧。'
        : '全部看完啦，真棒！🎉';
    }
  }

  /* ---------------- 学科 Tab ---------------- */
  var cur = 0;
  function paintTabs() {
    var box = $('tabs');
    if (!(DATA.subjects || []).length) { box.innerHTML = ''; return; }
    box.innerHTML = DATA.subjects.map(function (g, i) {
      var seen = 0;
      (g.series || []).forEach(function (s) { seen += seriesSeen(s); });
      return '<button class="tab' + (i === cur ? ' on' : '') + '" data-i="' + i + '">' +
        esc(g.emoji) + ' ' + esc(g.name) +
        '<span class="n">' + seen + '/' + (g.count || 0) + '</span></button>';
    }).join('');
  }

  /* ---------------- 系列 + 集（系列默认折叠，点开才看集） ---------------- */
  var openSet = {};                       /* 记住展开过哪些系列 */

  function seriesOpen(g, s) {
    if (!s.name) return true;             /* 直接放在学科下的散装视频：没有系列名，直接展开 */
    if ((g.series || []).length === 1) return true;
    return !!openSet[g.name + '|' + s.name];
  }

  function paintList() {
    var box = $('list');
    var g = (DATA.subjects || [])[cur];
    if (!g) { box.innerHTML = ''; return; }
    box.innerHTML = (g.series || []).map(function (s, si) {
      var open = seriesOpen(g, s);
      var seen = seriesSeen(s);
      var head = '<button class="shead" data-si="' + si + '">' +
        '<span class="edge" style="background:' + esc(g.color || '#e11d48') + '"></span>' +
        '<span class="stx">' +
          '<span class="sname">' + esc(s.name || (g.emoji + ' ' + g.name + ' · 其他')) + '</span>' +
          '<span class="smeta">' + (s.count || 0) + ' 集 · 已看 ' + seen +
            (s.seconds ? ' · 共 ' + Math.round(s.seconds / 60) + ' 分钟' : '') + '</span>' +
        '</span>' +
        '<span class="arw">▸</span></button>';

      var body = '<div class="sbody">' + (s.items || []).map(function (it) {
        var done = !!doneMap[it.id];
        var pos = posMap[it.id] || 0;
        var resumable = !done && pos >= RESUME_MIN;
        var st = !it.ok
          ? '<span class="st bad">格式可能不支持</span>'
          : (done ? '<span class="st done">✓ 看过了</span>' : '');
        return '<button class="vcard' + (done ? ' watched' : '') + '" data-id="' + esc(it.id) + '">' +
          '<span class="thumb">' + esc(g.emoji || '🎬') +
            '<span class="dur">' + fmtDur(it.sec) + '</span></span>' +
          '<span class="body">' +
            '<span class="t">' + esc(it.title) + '</span>' +
            (it.desc ? '<p class="d">' + esc(it.desc) + '</p>' : '') +
            st +
            (resumable ? '<span class="resume">上次看到 ' + fmtDur(pos) + '，接着看</span>' : '') +
          '</span></button>';
      }).join('') + '</div>';

      return '<div class="series' + (open ? ' open' : '') + '">' + head + body + '</div>';
    }).join('');
  }

  function paintAll() { paintHeader(); paintTabs(); paintList(); }

  /* ---------------- 播放 ---------------- */
  var vid = $('vid'), curItem = null, lastSave = 0;

  function showTip(html) {
    var el = $('ptip');
    el.innerHTML = html;
    el.className = 'ptip on';
  }
  function clearTip() { var el = $('ptip'); el.className = 'ptip'; el.innerHTML = ''; }

  /* 把"播放失败"翻成能照着做的一句话 —— 视频这边的静默失败同样很坑 */
  function explain(err) {
    var code = err ? err.code : 0;
    if (code === 4) {
      return '<b>这个视频的格式，这台设备放不了。</b><br>' +
        '多半是编码问题：iPad 只稳吃 <b>H.264 + AAC</b> 的 mp4。<br>' +
        '请家长用电脑转一下格式再放进来（详见 docs/运维手册.md 的视频一节）。';
    }
    if (code === 2) {
      return '<b>读不到视频文件。</b><br>' +
        '可能原因：① 没连上家里的网；② 视频还没上传到服务器；③ 清单里的路径和实际文件对不上。<br>' +
        '家长可以跑一次 <b>deploy_videos.py</b> 重新上传。';
    }
    if (code === 3) {
      return '<b>视频文件像是损坏了。</b><br>换一个文件试试，或者让家长重新拷一份。';
    }
    return '<b>播放被中断了。</b><br>点下面"重新加载"再试一次。';
  }

  function openVideo(item) {
    curItem = item;
    clearTip();
    $('pdone').className = 'done-tag';
    $('pTitle').textContent = item.title;
    $('pinfo').innerHTML = '时长 ' + fmtDur(item.sec) +
      (item.size ? ' · ' + (item.size / 1048576).toFixed(1) + ' MB' : '') +
      ' · 看完 ' + Math.round(DONE_RATIO * 100) + '% 就算学会';
    $('player').className = 'player';
    /* 续播：上次看到一半就接着放（太短就不记，避免"刚点开就退出"被记成进度） */
    var pos = posMap[item.id] || 0;
    if (pos >= RESUME_MIN && pos < item.sec * DONE_RATIO) {
      try { vid.currentTime = pos; } catch (e) {}
    }
    vid.src = item.file;
    /* 加载看门狗：6 秒还没拿到元数据就提示，避免"转圈转到底" */
    $('pbuf').className = 'pbuf on';
    var t0 = Date.now();
    var watchdog = setInterval(function () {
      if (vid.readyState >= 1) { clearInterval(watchdog); $('pbuf').className = 'pbuf'; return; }
      if (Date.now() - t0 > 6000 && !vid.error) {
        clearInterval(watchdog);
        $('pbuf').className = 'pbuf';
        if (vid.readyState < 1) {
          showTip('<b>视频一直加载不出来。</b><br>' +
            '如果正在用家里的 Wi-Fi，可以让家长确认视频已经上传；' +
            '如果是在外面，局域网地址可能是打不开的。<br>' +
            '<span class="acts"><button data-retry="1">重新加载</button></span>');
        }
      }
    }, 500);
    setTimeout(function () { try { vid.play(); } catch (e) {} }, 80);
  }

  function closeVideo() {
    try { vid.pause(); } catch (e) {}
    /* 关掉时把位置记下来，下次接着看 */
    if (curItem && vid.currentTime >= RESUME_MIN) {
      posMap[curItem.id] = Math.floor(vid.currentTime);
      writeMap(K_POS, posMap);
    }
    vid.removeAttribute('src');
    try { vid.load(); } catch (e) {}
    $('player').className = 'player hide';
    $('pbuf').className = 'pbuf';
    curItem = null;
    paintAll();
  }

  vid.addEventListener('timeupdate', function () {
    if (!curItem || !vid.duration) return;
    var ratio = vid.currentTime / vid.duration;
    if (ratio >= DONE_RATIO) {
      /* 注意：curItem 就是清单里的那个视频对象本身，写成 curItem.it 会抛 TypeError
         —— 表现是"看完也不记进度"的静默失败。 */
      markDone(curItem);
      var tg = $('pdone');
      /* 用 classList.contains 判断，不要用 className.indexOf('on') ——
         'done-tag' 本身就含 "on"（d-on-e-tag），会被误判成"已经亮过"。 */
      if (!tg.classList.contains('on')) {
        tg.className = 'done-tag on';
        if (doneCount() >= all.length && all.length) {
          tg.textContent = '🎉 全部视频都看完啦！这个内容已经算学会';
        }
      }
    }
    /* 每 5 秒存一次位置，避免频繁写 localStorage */
    var now = Date.now();
    if (now - lastSave > 5000) {
      lastSave = now;
      posMap[curItem.id] = Math.floor(vid.currentTime);
      writeMap(K_POS, posMap);
    }
  });

  vid.addEventListener('error', function () {
    $('pbuf').className = 'pbuf';
    showTip(explain(vid.error) +
      '<span class="acts"><button data-retry="1">重新加载</button>' +
      '<button data-close="1">回到列表</button></span>');
  });

  /* ---------------- 事件绑定 ---------------- */
  $('tabs').addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('.tab') : null;
    if (!b) return;
    cur = parseInt(b.getAttribute('data-i'), 10) || 0;
    paintAll();
  });

  $('list').addEventListener('click', function (e) {
    /* 先看是不是点了系列标题（展开/折叠） */
    var h = e.target.closest ? e.target.closest('.shead') : null;
    if (h) {
      var g = DATA.subjects[cur];
      var s = g && (g.series || [])[parseInt(h.getAttribute('data-si'), 10)];
      if (s && s.name) {
        var key = g.name + '|' + s.name;
        openSet[key] = !openSet[key];
        paintList();
      }
      return;
    }
    /* 再看到底点了哪个视频：用 id 找，比下标稳（列表结构变了也不会点错） */
    var c = e.target.closest ? e.target.closest('.vcard') : null;
    if (!c) return;
    var id = c.getAttribute('data-id');
    var hit = null;
    all.some(function (x) { if (x.it.id === id) { hit = x.it; return true; } return false; });
    if (hit) openVideo(hit);
  });

  $('pBack').addEventListener('click', closeVideo);

  $('ptip').addEventListener('click', function (e) {
    var t = e.target;
    if (t.getAttribute && t.getAttribute('data-retry')) {
      clearTip();
      if (curItem) openVideo(curItem);
      return;
    }
    if (t.getAttribute && t.getAttribute('data-close')) closeVideo();
  });

  function goHome() {
    if (window.XYB && XYB.exit) XYB.exit();
    else location.href = '../../index.html';
  }
  $('backHome').addEventListener('click', goHome);
  $('emptyBack').addEventListener('click', goHome);

  /* 浏览器后退键：播放中先关播放层，而不是直接离开页面 */
  window.addEventListener('popstate', function () {
    if (curItem) { closeVideo(); history.pushState(null, '', location.href); }
  });
  try { history.pushState(null, '', location.href); } catch (e) {}

  /* ---------------- 启动 ---------------- */
  if (!all.length) {
    $('tabs').className = 'hide';
    $('list').className = 'hide';
    $('empty').className = 'empty';
    $('emptyMsg').innerHTML = '请家长把视频放进 <code>videos/&lt;学科&gt;/</code> 目录，' +
      '然后跑一次 <code>python _build/build_video_index.py</code> 生成清单、' +
      '再跑 <code>python _build/deploy_videos.py</code> 上传。';
  } else {
    paintAll();
    reportProgress();
  }
})();
</script>
</body>
</html>
